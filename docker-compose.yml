services:
  redroid-forge:
    build:
      context: .
      args:
        # 1 = daemon with hardware decode (own minimal LGPL FFmpeg build, see the Dockerfile) -- on
        # by default since 23/10/2026; set HWDEC=0 only to skip building it (e.g. a smaller image
        # on a host that will never use it).
        HWDEC: ${HWDEC:-1}
    container_name: redroid-forge
    privileged: true
    pid: host
    network_mode: host
    environment:
      - PORT=${PORT:-8080}
      # Display-only (26/10/2026, setup wizard) -- the directory `docker compose` was run from
      # is where .env and this very file live, by Compose's own convention (same assumption the
      # BACKUPS_DIR/MEMINFO_FIX_DIR defaults further down already make). The running container
      # has no other way to know this host path, and the setup wizard needs it to tell whoever
      # is clicking through it exactly which .env to edit, instead of a vague "find your .env
      # somewhere".
      - REDROID_FORGE_REPO_DIR=${PWD}
      # Localhost-only by default (docs/ROADMAP.md Phase 6) -- there is no auth yet (Phase 7),
      # so whoever can reach this is able to create/delete/operate every instance. Set to
      # 0.0.0.0 or a specific interface address only once that risk is actually wanted.
      - REDROID_FORGE_BIND_HOST=${REDROID_FORGE_BIND_HOST:-127.0.0.1}
      - ADB_PORT_START=${ADB_PORT_START:-5555}
      - ADB_PORT_END=${ADB_PORT_END:-5595}
      # Only needed to really validate/use the hwenc module (see
      # backend/src/modules/hwenc/integrate.js) -- empty by default so as not to
      # demand this AOSP tree from anyone who brings up redroid-forge.
      - REDROID_HWENC_ARTIFACTS_DIR=${REDROID_HWENC_ARTIFACTS_DIR:-}
      # P-frames (see backend/native/vaapi-daemon/daemon.c) -- off (all-intra) unless set
      # to an integer > 1 (frames per IDR). Off by default in the repo's own compose
      # (nobody turned it on here yet); set in .env for this lab host, not committed.
      - REDROID_FORGE_ENCODE_IDR_PERIOD=${REDROID_FORGE_ENCODE_IDR_PERIOD:-1}
      # EXPERIMENTAL wifi-interno-virtwifi module (see backend/src/lib/virtWifi.js) --
      # empty by default, same reasoning as REDROID_HWENC_ARTIFACTS_DIR: the .ko is built
      # against this exact host's running kernel, never shipped in the repo.
      - REDROID_FORGE_VIRTWIFI_KO_PATH=${REDROID_FORGE_VIRTWIFI_KO_PATH:-}
      # Where instance backups live (see backend/src/lib/backup.js and settings.js) --
      # unlike the other paths above, this one is NOT optional/no-op: it needs to be an
      # absolute HOST path (defaults to $PWD, i.e. this repo checkout) because backup.js
      # bind-mounts it into throwaway sibling containers via the Docker socket below, which
      # resolves paths against the HOST, not against redroid-forge's own filesystem -- a
      # container-internal path here (e.g. the old default under /app/backend/data) would
      # silently create and fill a same-named folder on the real host instead. Bound at the
      # SAME path on both sides for exactly that reason (same trick as
      # REDROID_HWENC_ARTIFACTS_DIR above, just not optional).
      - REDROID_FORGE_BACKUPS_DIR=${REDROID_FORGE_BACKUPS_DIR:-${PWD}/backend/data/backups}
      # Same reasoning and same trick as REDROID_FORGE_BACKUPS_DIR right above (read it first) --
      # meminfoFix.js bind-mounts a generated file over /proc/meminfo in each capped instance via
      # the Docker socket, so this also has to be a real HOST path, bound at the SAME path on
      # both sides, not a container-internal one.
      - REDROID_FORGE_MEMINFO_FIX_DIR=${REDROID_FORGE_MEMINFO_FIX_DIR:-${PWD}/backend/data/meminfo-fix}
      # Access control (docs/ROADMAP.md Phase 7) -- "none" (default) is today's behavior
      # unchanged, no login, everyone sees/does everything. "local" turns on the built-in
      # account store (backend/src/lib/userStore.js, data persisted under
      # backend/data/users.json, same bind mount as everything else above) and seeds the very
      # first admin account from the two vars below (no-op once any user already exists, so it
      # never resets a changed password). "oidc" defers entirely to an external IdP -- see the
      # REDROID_FORGE_OIDC_* vars further down.
      - REDROID_FORGE_AUTH=${REDROID_FORGE_AUTH:-none}
      - REDROID_FORGE_LOCAL_ADMIN_USER=${REDROID_FORGE_LOCAL_ADMIN_USER:-}
      - REDROID_FORGE_LOCAL_ADMIN_PASSWORD=${REDROID_FORGE_LOCAL_ADMIN_PASSWORD:-}
      # Generic, MULTI-PROVIDER OIDC (NOT Keycloak-specific -- backend/src/lib/oidc.js) -- only
      # read when REDROID_FORGE_AUTH=oidc. Any number of trust sources at once (Google, your own
      # Keycloak, Plenum, another federation's IdP, ...): the login screen lists every provider
      # configured here, the person picks one, and ONLY that one is ever asked to vouch for them
      # -- redesigned 25/10/2026 from a single fixed provider.
      #
      # REDROID_FORGE_OIDC_PROVIDERS is a JSON array, one object per source:
      #   [{"id":"google","label":"Google","issuerUrl":"https://accounts.google.com","clientId":"..."},
      #    {"id":"keycloak","label":"My Keycloak","issuerUrl":"https://idp.example/realms/x","clientId":"...","clientSecret":"..."}]
      # "id" must be lowercase letters/digits/"-" (1-32 chars) -- it becomes part of that
      # provider's callback URL and of every one of its identities' external id
      # (`${id}:${sub}`, see oidc.js's own comment on why the `sub` alone is not enough).
      # "clientSecret" is optional (omit it for a public/PKCE-only client). A malformed entry is
      # just dropped (logged, not fatal) -- the rest of the array still works.
      #
      # REDROID_FORGE_OIDC_REDIRECT_BASE_URL (e.g. "https://redroid-forge.example") is this app's
      # own externally-reachable base URL -- every provider's redirect URI is derived from it
      # (base + "/api/auth/oidc/<id>/callback"), so adding a provider never means registering a
      # second callback URL by hand to keep in sync with this file.
      #
      # Identity ONLY: no provider is ever asked for a role claim -- every identity that logs in
      # starts out with NO role (backend/src/lib/roleAssignments.js, admin-only "Identities"
      # panel) until an admin grants one. BOOTSTRAP_ADMIN_ID is that first admin's own full
      # external id (`${providerId}:${sub}`, as it appears in data/role-assignments.json after
      # their first login) -- the only way an instance with no existing admin could otherwise
      # approve anyone at all, same bootstrap problem REDROID_FORGE_LOCAL_ADMIN_USER/_PASSWORD
      # solves for "local" mode. Leave it empty once a real admin exists; it is re-checked on
      # every login, not just once, which also lets you log in once to find your own id in that
      # file, set this, and log in again to self-promote without restarting in between.
      - REDROID_FORGE_OIDC_PROVIDERS=${REDROID_FORGE_OIDC_PROVIDERS:-}
      - REDROID_FORGE_OIDC_REDIRECT_BASE_URL=${REDROID_FORGE_OIDC_REDIRECT_BASE_URL:-}
      - REDROID_FORGE_OIDC_BOOTSTRAP_ADMIN_ID=${REDROID_FORGE_OIDC_BOOTSTRAP_ADMIN_ID:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /lib/modules:/lib/modules:ro
      - /dev/binderfs:/dev/binderfs
      - /dev/vaapi-helper:/dev/vaapi-helper
      # Read-only, same path, overriding the automatic private-cgroupns view Docker gives this
      # container by default -- meminfoFix.js needs the HOST's real cgroup v2 tree (every sibling
      # instance's own docker-<id>.scope/memory.current) to compute each instance's live
      # MemFree/Cached, not just this container's own slice (confirmed live 24/10/2026: without
      # this, `cat /proc/self/cgroup` inside here shows "0::/", a private namespace with no
      # sibling containers visible at all, and every refresh tick silently no-ops).
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ./backend/data:/app/backend/data
      # Optional bind (same source and destination path, integrate.js resolves
      # paths relative to REDROID_HWENC_ARTIFACTS_DIR above) -- if the
      # variable is not set, it mounts /dev/null:/dev/null (a harmless no-op) instead
      # of breaking `docker compose up` for whoever does not have this tree.
      - ${REDROID_HWENC_ARTIFACTS_DIR:-/dev/null}:${REDROID_HWENC_ARTIFACTS_DIR:-/dev/null}:ro
      # Same trick, single file instead of a directory, for the virt_wifi.ko above.
      - ${REDROID_FORGE_VIRTWIFI_KO_PATH:-/dev/null}:${REDROID_FORGE_VIRTWIFI_KO_PATH:-/dev/null}:ro
      - ${REDROID_FORGE_BACKUPS_DIR:-${PWD}/backend/data/backups}:${REDROID_FORGE_BACKUPS_DIR:-${PWD}/backend/data/backups}
      - ${REDROID_FORGE_MEMINFO_FIX_DIR:-${PWD}/backend/data/meminfo-fix}:${REDROID_FORGE_MEMINFO_FIX_DIR:-${PWD}/backend/data/meminfo-fix}
    restart: unless-stopped
