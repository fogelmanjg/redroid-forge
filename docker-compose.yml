services:
  redroid-forge:
    build:
      context: .
      args:
        # 1 = daemon with hardware decode (own minimal LGPL FFmpeg build, see the Dockerfile) -- on
        # by default since 23/10/2026; set HWDEC=0 only to skip building it (e.g. a smaller image
        # on a host that will never use it).
        HWDEC: ${HWDEC:-1}
    container_name: redroid-forge
    privileged: true
    pid: host
    network_mode: host
    environment:
      - PORT=${PORT:-8080}
      # Localhost-only by default (docs/ROADMAP.md Phase 6) -- there is no auth yet (Phase 7),
      # so whoever can reach this is able to create/delete/operate every instance. Set to
      # 0.0.0.0 or a specific interface address only once that risk is actually wanted.
      - REDROID_FORGE_BIND_HOST=${REDROID_FORGE_BIND_HOST:-127.0.0.1}
      - ADB_PORT_START=${ADB_PORT_START:-5555}
      - ADB_PORT_END=${ADB_PORT_END:-5595}
      # Only needed to really validate/use the hwenc module (see
      # backend/src/modules/hwenc/integrate.js) -- empty by default so as not to
      # demand this AOSP tree from anyone who brings up redroid-forge.
      - REDROID_HWENC_ARTIFACTS_DIR=${REDROID_HWENC_ARTIFACTS_DIR:-}
      # P-frames (see backend/native/vaapi-daemon/daemon.c) -- off (all-intra) unless set
      # to an integer > 1 (frames per IDR). Off by default in the repo's own compose
      # (nobody turned it on here yet); set in .env for this lab host, not committed.
      - REDROID_FORGE_ENCODE_IDR_PERIOD=${REDROID_FORGE_ENCODE_IDR_PERIOD:-1}
      # EXPERIMENTAL wifi-interno-virtwifi module (see backend/src/lib/virtWifi.js) --
      # empty by default, same reasoning as REDROID_HWENC_ARTIFACTS_DIR: the .ko is built
      # against this exact host's running kernel, never shipped in the repo.
      - REDROID_FORGE_VIRTWIFI_KO_PATH=${REDROID_FORGE_VIRTWIFI_KO_PATH:-}
      # Where instance backups live (see backend/src/lib/backup.js and settings.js) --
      # unlike the other paths above, this one is NOT optional/no-op: it needs to be an
      # absolute HOST path (defaults to $PWD, i.e. this repo checkout) because backup.js
      # bind-mounts it into throwaway sibling containers via the Docker socket below, which
      # resolves paths against the HOST, not against redroid-forge's own filesystem -- a
      # container-internal path here (e.g. the old default under /app/backend/data) would
      # silently create and fill a same-named folder on the real host instead. Bound at the
      # SAME path on both sides for exactly that reason (same trick as
      # REDROID_HWENC_ARTIFACTS_DIR above, just not optional).
      - REDROID_FORGE_BACKUPS_DIR=${REDROID_FORGE_BACKUPS_DIR:-${PWD}/backend/data/backups}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /lib/modules:/lib/modules:ro
      - /dev/binderfs:/dev/binderfs
      - /dev/vaapi-helper:/dev/vaapi-helper
      - ./backend/data:/app/backend/data
      # Optional bind (same source and destination path, integrate.js resolves
      # paths relative to REDROID_HWENC_ARTIFACTS_DIR above) -- if the
      # variable is not set, it mounts /dev/null:/dev/null (a harmless no-op) instead
      # of breaking `docker compose up` for whoever does not have this tree.
      - ${REDROID_HWENC_ARTIFACTS_DIR:-/dev/null}:${REDROID_HWENC_ARTIFACTS_DIR:-/dev/null}:ro
      # Same trick, single file instead of a directory, for the virt_wifi.ko above.
      - ${REDROID_FORGE_VIRTWIFI_KO_PATH:-/dev/null}:${REDROID_FORGE_VIRTWIFI_KO_PATH:-/dev/null}:ro
      - ${REDROID_FORGE_BACKUPS_DIR:-${PWD}/backend/data/backups}:${REDROID_FORGE_BACKUPS_DIR:-${PWD}/backend/data/backups}
    restart: unless-stopped
